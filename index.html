<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mon App de Tracking Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; color: #333; overflow: hidden; }
        #map { height: 40vh; width: 100%; border-bottom: 2px solid #ddd; position: relative; }
        
        .status-card {
            height: 60vh; background: #ffffff; padding: 15px 20px; box-sizing: border-box;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); position: relative; z-index: 1000; overflow-y: auto;
        }
        h2 { margin: 0; color: #2c3e50; font-size: 1.1rem; font-weight: 600; }
        h3 { margin: 15px 0 8px 0; color: #718096; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-box { background: #f8f9fa; padding: 8px; border-radius: 12px; border: 1px solid #edf2f7; text-align: center; }
        .stat-box span { display: block; font-size: 0.7rem; color: #718096; text-transform: uppercase; margin-bottom: 2px; }
        .stat-box strong { font-size: 1rem; color: #2d3748; }

        .info-line { display: flex; justify-content: space-between; margin-bottom: 5px; color: #555; font-size: 0.8rem; border-bottom: 1px dashed #edf2f7; padding-bottom: 3px; }
        
        .alerts-container { display: flex; gap: 6px; margin-top: 8px; justify-content: space-between; }
        .alert-pill { flex: 1; text-align: center; font-size: 0.65rem; font-weight: bold; padding: 5px 3px; border-radius: 8px; background: #edf2f7; color: #a0aec0; }
        .alert-pill.active-red { background: #fed7d7; color: #e53e3e; border: 1px solid #e53e3e; }
        .alert-pill.active-green { background: #c6f6d5; color: #22543d; }

        .action-container { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; width: 100%; box-sizing: border-box; }
        .custom-select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e0; font-size: 0.85rem; background: #f8f9fa; box-sizing: border-box; }
        .send-btn { width: 100%; background: #3498db; color: white; padding: 12px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: bold; text-align: center; box-sizing: border-box; display: block; text-decoration: none; }

        .history-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .history-item { background: #f8f9fa; padding: 10px; border-radius: 10px; border-left: 4px solid #3498db; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        .history-item-btn { background: #3498db; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; }
        
        .btn-freebox { width: 100%; background: #9b59b6; color: white; padding: 10px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .no-border-icon { background: none !important; border: none !important; }
        .radar-pulse { position: absolute; width: 12px; height: 12px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1; }
        .radar-pulse::after { content: ''; position: absolute; width: 100%; height: 100%; background: inherit; border-radius: 50%; animation: radar-glow 2s infinite ease-out; top: 0; left: 0; }
        @keyframes radar-glow { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="status-card">
        <div class="info-header">
            <h2>🏍️ F800R (Suivi Local)</h2>
            <span id="status-badge" class="badge" style="background: #2980b9; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold;">Stationné</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><span>Vitesse</span><strong id="speed">0 km/h</strong></div>
            <div class="stat-box"><span>Batterie Moto</span><strong id="battery-volts">- V</strong></div>
            <div class="stat-box"><span>Points ce jour</span><strong id="day-points">0</strong></div>
            <div class="stat-box"><span>Vitesse Max</span><strong id="max-speed">0 km/h</strong></div>
        </div>

        <div class="info-line"><span>Dernier relevé :</span> <strong id="time">-</strong></div>
        <div class="info-line"><span>Position :</span> <strong id="coords">-</strong></div>

        <div class="alerts-container">
            <div id="alert-power" class="alert-pill">🔌 Alim OK</div>
            <div id="alert-shock" class="alert-pill">🛡️ Pas de Choc</div>
            <div id="alert-lowbat" class="alert-pill">🔋 Bat OK</div>
        </div>

        <h3>⚡ Commandes Antivol (ST-901)</h3>
        <div class="action-container">
            <select id="sms-action" class="custom-select" onchange="actualiserLienSMS()">
                <option value="RCONF">📋 Lecture Configuration Globale (RCONF)</option>
                <option value="6690000">📍 Demander Position SMS (6690000)</option>
                <option value="9400000">🛑 Coupure Relais / Arrêt Moteur (9400000)</option>
                <option value="9410000">🟢 Rétablir Relais / Autoriser Démarrage (9410000)</option>
                <option value="2110000">🛡️ Activer Alarme Périmètre (2110000)</option>
                <option value="2100000">🔓 Désactiver Alarme Périmètre (2100000)</option>
                <option value="1810000T10">💥 Activer Alarme Choc - 10s (1810000T10)</option>
                <option value="1800000">✅ Désactiver Alarme Choc (1800000)</option>
                <option value="SLEEP0000 5">💤 Activer Mode Veille après 5min (SLEEP0000 5)</option>
                <option value="SLEEP0000 0">🔥 Désactiver Mode Veille - Continu (SLEEP0000 0)</option>
            </select>
            <a id="btn-sms-direct" href="sms:+33759671722?body=RCONF" class="send-btn">Envoyer le SMS</a>
        </div>

        <h3>📂 Archives Trajets (Disque Freebox)</h3>
        <button class="btn-freebox" onclick="sauvegarderVersFreebox()">💾 Synchroniser les trajets sur ma Freebox</button>
        <div id="saved-trips" class="history-list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURATION CLIENT ---
        const NUMERO_MOTO = "+33759671722"; 
        const BASE64_TOKEN = "bWFydGluZWNocmlzQGZyZWUuZnI6NDc3ODAwNkNhPw=="; 
        const ID_TRACCAR = "16146"; 
        
        // Vos identifiants de l'option "Notifications par SMS" Free Mobile
        const FREE_USER = "TON_ID_SUBSCRIBER_FREE"; 
        const FREE_PASS = "TA_PASS_GENEREE_PAR_FREE"; 

        const map = L.map('map', { zoomControl: false }).setView([43.36489, 3.41575], 15);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let vehicleMarker = null;
        let savedRouteLayer = null;
        let dailyMaxSpeed = 0;
        let dernierChocAlerte = false;

        function actualiserLienSMS() {
            const commande = document.getElementById('sms-action').value;
            document.getElementById('btn-sms-direct').href = "sms:" + NUMERO_MOTO + "?body=" + commande;
        }

        // --- GESTION DES NOTIFICATIONS SILENCIEUSES (FREE MOBILE) ---
        function envoyerAlerteFreeSMS(message) {
            if(FREE_USER === "TON_ID_SUBSCRIBER_FREE") return; 
            const url = `https://smsapi.free-mobile.fr/sendmsg?user=${FREE_USER}&pass=${FREE_PASS}&msg=${encodeURIComponent(message)}`;
            fetch(url, { mode: 'no-cors' }).catch(e => console.log("Alerte envoyée"));
        }

        // --- SAUVEGARDE ET SEGMENTATION LOCALE ---
        function savePointToLocalHistory(lat, lon, speed) {
            let history = JSON.parse(localStorage.getItem('moto_coordinates_log')) || [];
            const timestamp = Date.now();
            
            if (history.length > 0) {
                const lastPoint = history[history.length - 1];
                if (lastPoint.lat === lat && lastPoint.lon === lon && speed === 0) return;
            }

            history.push({ lat, lon, speed, time: timestamp });
            localStorage.setItem('moto_coordinates_log', JSON.stringify(history));
            document.getElementById('day-points').innerText = history.length;
            renderSavedTrips();
        }

        function renderSavedTrips() {
            const rawLog = JSON.parse(localStorage.getItem('moto_coordinates_log')) || [];
            const container = document.getElementById('saved-trips');
            container.innerHTML = "";

            if (rawLog.length === 0) {
                container.innerHTML = "<div style='font-size:0.75rem;color:#a0aec0;text-align:center;padding:10px;'>Aucun trajet en mémoire.</div>";
                return;
            }

            let trips = [];
            let currentTrip = [];

            rawLog.forEach((point, index) => {
                if (index === 0) { currentTrip.push(point); } else {
                    const prevPoint = rawLog[index - 1];
                    if (((point.time - prevPoint.time) / 1000 / 60) > 10) { 
                        trips.push(currentTrip); currentTrip = [point];
                    } else { currentTrip.push(point); }
                }
            });
            if (currentTrip.length > 0) trips.push(currentTrip);

            trips.reverse().forEach((trip, idx) => {
                const startTime = new Date(trip[0].time).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                const maxSpeedTrip = Math.max(...trip.map(p => p.speed));
                
                const item = document.createElement('div');
                item.className = "history-item";
                item.innerHTML = `
                    <div><strong>📅 ${startTime}</strong><br>⏱️ ${trip.length} positions enregistrées</div>
                    <button class="history-item-btn" onclick='showSavedTripOnMap(${JSON.stringify(trip)})'>📍 Tracer</button>
                `;
                container.appendChild(item);
            });
        }

        function showSavedTripOnMap(tripPoints) {
            if (savedRouteLayer) map.removeLayer(savedRouteLayer);
            const latLngs = tripPoints.map(p => [p.lat, p.lon]);
            savedRouteLayer = L.polyline(latLngs, { color: '#9b59b6', weight: 6, opacity: 0.9, dashArray: '5, 10' }).addTo(map);
            map.fitBounds(savedRouteLayer.getBounds(), { padding: [30, 30] });
        }

        // --- EXPORTATION PHYSIQUE SUR LE SERVEUR NAS DE LA FREEBOX ---
        function sauvegarderVersFreebox() {
            const rawLog = localStorage.getItem('moto_coordinates_log');
            if(!rawLog || rawLog === "[]") {
                alert("Aucune donnée locale à synchroniser."); return;
            }

            // Génération d'un fichier JSON téléchargeable directement vers le dossier réseau de la Freebox
            const blob = new Blob([rawLog], { type: "application/json" });
            const nomFichier = `trajet_moto_${new Date().toISOString().slice(0,10)}.json`;
            
            // Simule l'écriture réseau ou invite au dépôt rapide sur '\\freebox' ou 'mafreebox.freebox.fr'
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = nomFichier;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            alert(`Fichier journal généré avec succès.\nVous pouvez le faire glisser directement dans l'explorateur Freebox OS pour un archivage définitif à la maison.`);
        }

        // --- TRAITEMENT DU DIRECT ---
        async function updateTracking() {
            try {
                const response = await fetch('https://demo4.traccar.org/api/positions', {
                    method: 'GET', mode: 'cors',
                    headers: { 'Authorization': 'Basic ' + BASE64_TOKEN, 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error("Serveur injoignable");
                const positions = await response.json();
                const target = positions.find(p => String(p.deviceId) === ID_TRACCAR);
                
                if (target) {
                    const lat = target.latitude; const lon = target.longitude;
                    const date = new Date(target.fixTime).toLocaleTimeString('fr-FR');
                    const rawSpeed = Math.round(target.speed * 1.852);
                    const isMoving = rawSpeed > 3; const speedKmh = isMoving ? rawSpeed : 0;
                    
                    if (speedKmh > dailyMaxSpeed) dailyMaxSpeed = speedKmh;

                    // Enregistrement en mémoire locale immédiat avant l'expiration des 12h de la passerelle
                    savePointToLocalHistory(lat, lon, speedKmh);

                    document.getElementById('speed').innerText = speedKmh + " km/h";
                    document.getElementById('max-speed').innerText = dailyMaxSpeed + " km/h";
                    document.getElementById('time').innerText = date;
                    document.getElementById('coords').innerText = lat.toFixed(5) + ", " + lon.toFixed(5);
                    document.getElementById('status-badge').innerText = isMoving ? "En mouvement" : "Stationné";
                    document.getElementById('status-badge').style.background = isMoving ? "#2ecc71" : "#2980b9";

                    // Analyse des alarmes matérielles du ST-901
                    let alarm = (target.attributes && target.attributes.alarm) ? target.attributes.alarm : "";
                    
                    if (alarm === "vibration" || alarm === "shock") {
                        document.getElementById('alert-shock').className = "alert-pill active-red";
                        if(!dernierChocAlerte) {
                            envoyerAlerteFreeSMS("🚨 ALERTE MOTO : Secousse ou choc détecté sur la F800R !");
                            dernierChocAlerte = true;
                        }
                    } else {
                        document.getElementById('alert-shock').className = "alert-pill active-green";
                        dernierChocAlerte = false;
                    }

                    const badgeColor = isMoving ? "#2ecc71" : "#2980b9";
                    const stableIcon = L.divIcon({
                        html: `<div style="position: relative; width: 42px; height: 42px;"><div class="radar-pulse" style="background: ${badgeColor};"></div><svg style="width: 34px; height: 34px; margin-top: 4px;" viewBox="0 0 24 24"><path fill="#2c3e50" d="M19.5,14c-1.4,0-2.5,1.1-2.5,2.5c0,1.4,1.1,2.5,2.5,2.5s2.5-1.1,2.5-2.5C22,15.1,20.9,14,19.5,14z M17.4,11l-2.2-4H11V5h2V3h-4v2h2v2H7.8L5.3,11H2v2h4.2l1.1-2h6.3l1.9,3.5h1.2l-2.4-4.5H17.4z"/></svg></div>`,
                        iconSize: [42, 42], iconAnchor: [21, 21], className: 'no-border-icon'
                    });

                    if (vehicleMarker) { vehicleMarker.setLatLng([lat, lon]); } else {
                        vehicleMarker = L.marker([lat, lon], { icon: stableIcon }).addTo(map);
                        map.setView([lat, lon], 15);
                    }
                }
            } catch (error) { console.error(error); }
        }

        actualiserLienSMS();
        renderSavedTrips();
        updateTracking();
        setInterval(updateTracking, 15000);
    </script>
</body>
</html>
